<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 800px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .status {
            font-size: 12px;
            margin-top: 10px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            display: inline-block;
        }

        .status.ready {
            background: rgba(76, 175, 80, 0.3);
        }

        .status.loading {
            background: rgba(255, 193, 7, 0.3);
        }

        .status.error {
            background: rgba(244, 67, 54, 0.3);
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .messages {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.5;
        }

        .user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .assistant .message-content {
            background: #e0e0e0;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .sources {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 4px;
            max-width: 70%;
        }

        .sources strong {
            display: block;
            margin-bottom: 4px;
        }

        .source-item {
            padding: 2px 0;
        }

        .input-area {
            border-top: 1px solid #ddd;
            padding: 20px;
            background: white;
            border-radius: 0 0 12px 12px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-group button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .input-group button:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .input-group button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .controls button {
            padding: 8px 16px;
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .controls button:hover {
            background: #e0e0e0;
        }

        .controls button.danger {
            background: #ffebee;
            color: #c62828;
            border-color: #c62828;
        }

        .controls button.danger:hover {
            background: #ffcdd2;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            text-align: center;
        }

        .empty-state h2 {
            margin-bottom: 10px;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #c62828;
        }

        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #2e7d32;
        }

        @media (max-width: 600px) {
            .container {
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }

            .header {
                border-radius: 0;
            }

            .input-area {
                border-radius: 0;
            }

            .message-content {
                max-width: 85%;
            }

            .sources {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 RAG Chatbot</h1>
            <p>Ask questions about your documents</p>
            <div class="status" id="status">
                <span id="statusText">Initializing...</span>
            </div>
        </div>

        <div class="chat-area">
            <div id="messagesContainer" class="messages">
                <div class="empty-state">
                    <h2>Welcome to the RAG Chatbot</h2>
                    <p>Type a question below to get started</p>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div id="notification"></div>
            <div class="input-group">
                <input 
                    type="text" 
                    id="queryInput" 
                    placeholder="Ask a question..." 
                    autocomplete="off"
                />
                <button id="sendBtn" onclick="sendQuery()">Send</button>
            </div>
            <div class="controls">
                <button id="ingestBtn" onclick="ingestDocuments()">📥 Ingest Documents</button>
                <button id="clearBtn" onclick="clearDatabase()" class="danger">🗑️ Clear Database</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://localhost:5000";
        let initialized = false;
        let isLoading = false;

        async function updateStatus(message, type = 'loading') {
            const statusEl = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            statusEl.className = 'status ' + type;
            statusText.textContent = message;
        }

        async function initializeSystem() {
            try {
                updateStatus('Initializing system...', 'loading');
                const response = await fetch(`${API_BASE}/api/initialize`, {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    initialized = true;
                    updateStatus('System initialized ✓', 'ready');
                    showNotification('System ready! Load documents to get started.', 'success');
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                updateStatus('Initialization failed', 'error');
                showNotification('Failed to initialize: ' + error.message, 'error');
            }
        }

        async function ingestDocuments() {
            if (!initialized) {
                showNotification('System not initialized', 'error');
                return;
            }

            const btn = document.getElementById('ingestBtn');
            btn.disabled = true;
            
            try {
                updateStatus('Ingesting documents...', 'loading');
                const response = await fetch(`${API_BASE}/api/ingest`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.status === 'success') {
                    const msg = data.added_samples 
                        ? `Ingested ${data.count} sample documents` 
                        : `Ingested ${data.count} document chunks`;
                    showNotification(msg, 'success');
                    updateStatus('Documents loaded ✓', 'ready');
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                updateStatus('Ingestion failed', 'error');
                showNotification('Failed to ingest documents: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        async function sendQuery() {
            const input = document.getElementById('queryInput');
            const query = input.value.trim();

            if (!query) {
                showNotification('Please enter a question', 'error');
                return;
            }

            if (!initialized) {
                showNotification('System not initialized', 'error');
                return;
            }

            if (isLoading) return;

            clearEmptyState();
            addMessage('user', query);
            
            input.value = '';
            isLoading = true;
            document.getElementById('sendBtn').disabled = true;

            const loadingMessageId = 'loading-' + Date.now();
            addMessage('assistant', '<div class="spinner"></div> Thinking...', loadingMessageId);

            try {
                const response = await fetch(`${API_BASE}/api/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query, top_k: 3 })
                });

                const data = await response.json();
                removeMessage(loadingMessageId);

                if (data.status === 'success') {
                    addMessage('assistant', data.answer);
                    if (data.sources && data.sources.length > 0) {
                        addSources(data.sources);
                    }
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                removeMessage(loadingMessageId);
                showNotification('Error: ' + error.message, 'error');
            } finally {
                isLoading = false;
                document.getElementById('sendBtn').disabled = false;
                input.focus();
            }
        }

        async function clearDatabase() {
            if (!initialized) {
                showNotification('System not initialized', 'error');
                return;
            }

            if (!confirm('Are you sure you want to clear the entire database?')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/clear`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.status === 'success') {
                    showNotification('Database cleared', 'success');
                    document.getElementById('messagesContainer').innerHTML = `
                        <div class="empty-state">
                            <h2>Welcome to the RAG Chatbot</h2>
                            <p>Type a question below to get started</p>
                        </div>
                    `;
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                showNotification('Failed to clear database: ' + error.message, 'error');
            }
        }

        function addMessage(role, content, id = null) {
            const container = document.getElementById('messagesContainer');
            const messageEl = document.createElement('div');
            messageEl.className = `message ${role}`;
            if (id) messageEl.id = id;

            const contentEl = document.createElement('div');
            contentEl.className = 'message-content';
            contentEl.innerHTML = content;

            messageEl.appendChild(contentEl);
            container.appendChild(messageEl);
            container.scrollTop = container.scrollHeight;
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function addSources(sources) {
            const container = document.getElementById('messagesContainer');
            const sourcesEl = document.createElement('div');
            sourcesEl.className = 'sources';
            
            let html = '<strong>📚 Sources:</strong>';
            sources.forEach((source, index) => {
                html += `<div class="source-item">${index + 1}. ${source.source || 'Unknown'}</div>`;
            });
            
            sourcesEl.innerHTML = html;
            container.appendChild(sourcesEl);
        }

        function showNotification(message, type = 'error') {
            const notification = document.getElementById('notification');
            notification.innerHTML = `<div class="${type}-message">${message}</div>`;
            
            setTimeout(() => {
                notification.innerHTML = '';
            }, 5000);
        }

        function clearEmptyState() {
            const container = document.getElementById('messagesContainer');
            if (container.querySelector('.empty-state')) {
                container.innerHTML = '';
            }
        }

        // Handle Enter key
        document.getElementById('queryInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendQuery();
            }
        });

        // Initialize on page load
        window.addEventListener('load', () => {
            initializeSystem();
        });
    </script>
</body>
</html>
